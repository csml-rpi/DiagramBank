name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install duckdb==1.5.4 bibtexparser==1.4.4
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
